#version: '3'
services:
 
  frontend:
    build:
      # Use the current directory as the build context
      # This allows us to access the files in the current directory inside the Dockerfile
      context: ./
      dockerfile: ./frontend/Dockerfile
    ports:
      # Expose port 8080 on the host, and map port 80 of the container to port 8080 on the host
      # Access the application at http://localhost:8080
      - "8080:80"
    volumes:
      # Mount the frontend directory
      - ./frontend/src:/usr/share/nginx/html
 
  orchestrator:
    build:
      # Use the current directory as the build context
      # This allows us to access the files in the current directory inside the Dockerfile
      context: ./
      # Use the Dockerfile in the orchestrator directory
      dockerfile: ./orchestrator/Dockerfile
    ports:
      # Expose port 8081 on the host, and map port 5000 of the container to port 8081 on the host
      #- 8081:5000
      - "8081:8081"
    environment:
      # Pass the environment variables to the container
      # The PYTHONUNBUFFERED environment variable ensures that the output from the application is logged to the console
      - PYTHONUNBUFFERED=TRUE
      # The PYTHONFILE environment variable specifies the absolute entry point of the application
      # Check app.py in the orchestrator directory to see how this is used
      - PYTHONFILE=/app/orchestrator/src/app.py
      - ORDER_QUEUE_HOST=order_queue:6000
      - BOOKS_PRIMARY=books_primary:7000
      - PAYMENT_HOST=payment:7100
    volumes:
      # Mount the utils directory in the current directory to the /app/utils directory in the container
      - ./utils:/app/utils
      # Mount the orchestrator/src directory in the current directory to the /app/orchestrator/src directory in the container
      - ./orchestrator/src:/app/orchestrator/src
 
  fraud_service:
    build:
      # Use the current directory as the build context
      # This allows us to access the files in the current directory inside the Dockerfile
      context: ./
      # Use the Dockerfile in the fraud_detection directorys
      dockerfile: ./fraud_detection/Dockerfile
    ports:
      # Expose port 50051 on the host, and map port 50051 of the container to port 50051 on the host
      - 50051:50051
    environment:
      # Pass the environment variables to the container
      # The PYTHONUNBUFFERED environment variable ensures that the output from the application is logged to the console
      - PYTHONUNBUFFERED=TRUE
      # The PYTHONFILE environment variable specifies the absolute entry point of the application
      # Check app.py in the fraud_detection directory to see how this is used
      - PYTHONFILE=/app/fraud_detection/src/app.py
    volumes:
      # Mount the utils directory in the current directory to the /app/utils directory in the container
      - ./utils:/app/utils
      # Mount the fraud_detection/src directory in the current directory to the /app/fraud_detection/src directory in the container
      - ./fraud_detection/src:/app/fraud_detection/src

  verification_service:
    build:
      context: ./
      dockerfile: ./verification_service/Dockerfile
    ports:
      - "50052:50052"
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/verification_service/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./verification_service/src:/app/verification_service/src

  suggestions_service:
    build:
      context: ./
      dockerfile: ./suggestions_service/Dockerfile
    ports:
      - "50053:50053"
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/suggestions_service/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./suggestions_service/src:/app/suggestions_service/src

  order_queue:
    build:
      context: ./
      dockerfile: ./order_queue/Dockerfile
    ports:
      - "6000:6000"
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_queue/src/server.py
    volumes:
      - ./utils:/app/utils
      - ./order_queue/src:/app/order_queue/src

  # Executor Service Replicas
  executor_1:
    build:
      context: ./
      dockerfile: ./executor_service/Dockerfile
    environment:
      - EXECUTOR_ID=1
      - KNOWN_EXECUTOR_IDS=1,2,3
      - ORDER_QUEUE_HOST=order_queue:6000
      # ↓↓↓ new
      - BOOKS_PRIMARY=books_primary:7000
      - PAYMENT_HOST=payment:7100
    depends_on:
      - order_queue
    volumes:
      - ./utils:/app/utils
      - ./executor_service/src:/app/executor_service/src
    ports:
      - "5001:5001"
    mem_limit: 3072m
    mem_reservation: 1536m

  executor_2:
    build:
      context: ./
      dockerfile: ./executor_service/Dockerfile
    environment:
      - EXECUTOR_ID=2
      - KNOWN_EXECUTOR_IDS=1,2,3
      - ORDER_QUEUE_HOST=order_queue:6000
      - BOOKS_PRIMARY=books_primary:7000
      - PAYMENT_HOST=payment:7100
    depends_on:
      - order_queue
    volumes:
      - ./utils:/app/utils
      - ./executor_service/src:/app/executor_service/src
    ports:
      - "5002:5002"
    mem_limit: 3072m
    mem_reservation: 1536m

  executor_3:
    build:
      context: ./
      dockerfile: ./executor_service/Dockerfile
    environment:
      - EXECUTOR_ID=3
      - KNOWN_EXECUTOR_IDS=1,2,3
      - ORDER_QUEUE_HOST=order_queue:6000
      - BOOKS_PRIMARY=books_primary:7000
      - PAYMENT_HOST=payment:7100
    depends_on:
      - order_queue
    volumes:
      - ./utils:/app/utils
      - ./executor_service/src:/app/executor_service/src
    ports:
      - "5003:5003"
    mem_limit: 3072m
    mem_reservation: 1536m


  # ---------------  BOOKS DATABASE  ----------------
  books_primary:
    build:
      context: ./
      dockerfile: ./books_service/Dockerfile
    environment:
      - ROLE=primary                # ← runs the primary‑backup logic
      - BOOKS_PORT=7000
      # comma‑separated host:port list of backups
      - BACKUPS=books_backup1:7001,books_backup2:7002
    ports:
      - "7000:7000"                 # expose for easy local testing
    volumes:
      - ./books_service/src:/app/books_service/src
      - ./utils:/app/utils

  books_backup1:
    build:
      context: ./
      dockerfile: ./books_service/Dockerfile
    environment:
      - ROLE=backup
      - BOOKS_PORT=7001
    ports:
      - "7001:7001"
    volumes:
      - ./books_service/src:/app/books_service/src
      - ./utils:/app/utils

  books_backup2:
    build:
      context: ./
      dockerfile: ./books_service/Dockerfile
    environment:
      - ROLE=backup
      - BOOKS_PORT=7002
    ports:
      - "7002:7002"
    volumes:
      - ./books_service/src:/app/books_service/src
      - ./utils:/app/utils


  # ------------------  PAYMENT  --------------------
  payment:
    build:
      context: ./
      dockerfile: ./payment_service/Dockerfile
    environment:
      - PAY_PORT=7100
    ports:
      - "7100:7100"
    volumes:
      - ./payment_service/src:/app/payment_service/src
      - ./utils:/app/utils
