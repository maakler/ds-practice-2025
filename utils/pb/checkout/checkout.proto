syntax = "proto3";

package checkout;

message UserData {
  string name = 1;
  string contact = 2;
}

message CreditCardData {
  string number = 1;
  string expirationDate = 2;
  string cvv = 3;
}

message ItemData {
  string name = 1;
  int32 quantity = 2;
  double price = 3;
}

message OrderData {
  UserData user = 1;
  CreditCardData credit_card = 2;
  repeated ItemData items = 3;
  // Additional fields if needed
}

// For vector clocks, we’ll just treat them as repeated integers.
message OrderInitRequest {
  string order_id = 1;
  OrderData data = 2;
}

message OrderInitResponse {
  bool success = 1;
  repeated int32 vc = 2;  // current vector clock
  string message = 3;
}

message OrderEventRequest {
  string order_id = 1;
  repeated int32 vc = 2;  // incoming vector clock
}

message OrderEventResponse {
  bool fail = 1;
  string message = 2;
  repeated int32 vc = 3;
  // For suggestions, we can optionally include a list:
  repeated SuggestedBook suggestions = 4;
}

message SuggestedBook {
  string book_id = 1;
  string title = 2;
  string author = 3;
}

message OrderClearRequest {
  string order_id = 1;
  repeated int32 final_vc = 2;
}

message OrderClearResponse {
  bool success = 1;
  string message = 2;
}

// Transaction Verification
service VerificationService {
  rpc InitOrder(OrderInitRequest) returns (OrderInitResponse);
  rpc VerifyItems(OrderEventRequest) returns (OrderEventResponse);
  rpc VerifyUserData(OrderEventRequest) returns (OrderEventResponse);
  rpc VerifyCreditCard(OrderEventRequest) returns (OrderEventResponse);
  rpc ClearOrder(OrderClearRequest) returns (OrderClearResponse);
}

// Fraud Detection
service FraudService {
  rpc InitOrder(OrderInitRequest) returns (OrderInitResponse);
  rpc CheckUserFraud(OrderEventRequest) returns (OrderEventResponse);
  rpc CheckCreditCardFraud(OrderEventRequest) returns (OrderEventResponse);
  rpc ClearOrder(OrderClearRequest) returns (OrderClearResponse);
}

// Suggestions
service SuggestionsService {
  rpc InitOrder(OrderInitRequest) returns (OrderInitResponse);
  rpc GenerateSuggestions(OrderEventRequest) returns (OrderEventResponse);
  rpc ClearOrder(OrderClearRequest) returns (OrderClearResponse);
}
