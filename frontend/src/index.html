<!-- frontend/index.html  (2025‑05‑07) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book‑Shop Demo Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>[x-cloak]{display:none}</style>
</head>
<body class="bg-gray-100 min-h-screen overflow-y-auto">

<!-- ──────────────────────────────────────────────────────────
     0.  GLOBAL ENDPOINTS – adjust only here
────────────────────────────────────────────────────────── -->
<script>
const ORCH   = 'http://localhost:8081';
const CHECKOUT = `${ORCH}/checkout_extended`;
const DEMO_URL = `${ORCH}/run_demo`;

const DB_PRIMARY = 'http://localhost:7080';
const DB_READ  = `${DB_PRIMARY}/read`;
const DB_WRITE = `${DB_PRIMARY}/delta`;

const PAY_HOST = 'http://localhost:7180';
const PAY_CHARGE = `${PAY_HOST}/charge`;
const PAY_REFUND = `${PAY_HOST}/refund`;
</script>

<!-- ──────────────────────────────────────────────────────────
     1.  MANUAL CHECKOUT
────────────────────────────────────────────────────────── -->
<div class="m-6 mx-auto max-w-2xl bg-white p-6 rounded-lg shadow">
  <h1 class="text-2xl font-bold text-center mb-6">Manual Checkout</h1>

  <form id="checkoutForm" class="space-y-3">
    <input name="name"  placeholder="Name" value="John Doe"            class="w-full input">
    <input name="email" placeholder="Email" value="john@example.com"   class="w-full input">
    <input name="cc"    placeholder="Credit‑Card (16d)" value="1111222233334444" class="w-full input">
    <input name="exp"   placeholder="MM/YY" value="12/25"              class="w-full input">
    <input name="cvv"   placeholder="CVV"   value="123"                class="w-full input">

    <p class="font-semibold pt-2">Items in cart</p>
    <ul class="bg-gray-50 p-3 rounded">
      <li>Book A ×1 ($10)</li>
      <li>Book B ×2 ($15)</li>
    </ul>

    <button class="btn-blue w-full">Submit</button>
  </form>
  <pre id="manualOut" class="hidden mt-4 bg-gray-50 p-3 rounded text-sm"></pre>
</div>

<!-- ──────────────────────────────────────────────────────────
     2.  SCENARIO BUTTONS
────────────────────────────────────────────────────────── -->
<div class="m-6 mx-auto max-w-2xl bg-white p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Scenario Tests</h2>

  <div class="grid grid-cols-2 gap-3 text-sm">
    <button class="btn-gray" onclick="scenario('Valid',dataValid)">Valid Minimal</button>
    <button class="btn-gray" onclick="scenario('Fraud',dataFraud)">Big Total ⇒ Fraud</button>
    <button class="btn-gray" onclick="scenario('Bad CC',dataBadCC)">Bad CC ⇒ Fail</button>
    <button class="btn-gray" onclick="scenario('No Items',dataNoItems)">No Items ⇒ Fail</button>
    <button class="btn-gray" onclick="scenario('400',dataNoUser)">Missing User ⇒ 400</button>
  </div>

  <pre id="scenOut" class="hidden mt-4 bg-gray-50 p-3 rounded text-sm"></pre>
</div>

<!-- ──────────────────────────────────────────────────────────
     3.  ONE‑CLICK DEMO
────────────────────────────────────────────────────────── -->
<div class="m-6 mx-auto max-w-2xl bg-white p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold mb-3">End‑to‑End Demo (vector‑clock + 2‑PC)</h2>
  <button class="btn-purple" onclick="runDemo()">Run Demo</button>
  <pre id="demoOut" class="hidden mt-4 bg-gray-50 p-3 rounded text-sm"></pre>
</div>

<!-- ──────────────────────────────────────────────────────────
     4.  BOOKS‑DB PANEL
────────────────────────────────────────────────────────── -->
<div class="m-6 mx-auto max-w-2xl bg-white p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Books DB – Stock</h2>
  <div class="flex gap-2 mb-3">
    <input id="titleInp" value="Distributed Systems" class="flex-1 input">
    <button class="btn-gray" onclick="dbGet()">🔍 GET</button>
    <button class="btn-green" onclick="dbDelta(+10)">+10</button>
    <button class="btn-red"   onclick="dbDelta(-1)">−1</button>
  </div>
  <pre id="dbOut" class="hidden bg-gray-50 p-3 rounded text-sm"></pre>
</div>

<!-- ──────────────────────────────────────────────────────────
     5.  PAYMENT PANEL
────────────────────────────────────────────────────────── -->
<div class="m-6 mx-auto max-w-2xl bg-white p-6 rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Payment Stub</h2>
  <div class="flex gap-2 mb-3">
    <input id="payOrder" value="demo‑order" class="flex-1 input">
    <input id="payAmt"   value="99.99"      class="w-28 input">
    <button class="btn-green" onclick="pay('charge')">Charge</button>
    <button class="btn-red"   onclick="pay('refund')">Refund</button>
  </div>
  <pre id="payOut" class="hidden bg-gray-50 p-3 rounded text-sm"></pre>
</div>

<!-- ──────────────────────────────────────────────────────────
     6.  MINIMAL TAILWIND UTILS
────────────────────────────────────────────────────────── -->
<style>
.input{border:1px solid #d1d5db;border-radius:.5rem;padding:.45rem}
.btn-blue  {background:#2563eb;color:#fff;padding:.45rem 1rem;border-radius:.5rem}
.btn-gray  {background:#e5e7eb;padding:.45rem;border-radius:.5rem}
.btn-purple{background:#c4b5fd;padding:.55rem 1.2rem;border-radius:.5rem}
.btn-green {background:#86efac;padding:.35rem .8rem;border-radius:.4rem}
.btn-red   {background:#fecaca;padding:.35rem .8rem;border-radius:.4rem}
pre{white-space:pre-wrap;word-break:break-word}
</style>

<!-- ──────────────────────────────────────────────────────────
     7.  JAVASCRIPT
────────────────────────────────────────────────────────── -->
<script>
/* ─── helper ─────────────────────────────────────────────── */
function show(id,msg,ok=true){
  const e=document.getElementById(id);
  e.textContent = msg;
  e.classList.remove('hidden');
  e.style.background = ok ? '#dcfce7' : '#fee2e2';
}

/* ─── 1. manual checkout ─────────────────────────────────── */
document.getElementById('checkoutForm').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const body={
    user:{name:ev.target.name.value,contact:ev.target.email.value},
    creditCard:{number:ev.target.cc.value,expirationDate:ev.target.exp.value,cvv:ev.target.cvv.value},
    items:[{name:"Book A",quantity:1,price:10},{name:"Book B",quantity:2,price:15}],
    total:40
  };
  show('manualOut','⏳ sending …');
  try{
    const resp=await fetch(CHECKOUT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const json=await resp.json().catch(()=>({raw:'non‑json'}));
    show('manualOut',JSON.stringify(json,null,2),resp.ok);
  }catch(e){show('manualOut',e,false);}
});

/* ─── 2.  scenario buttons  ──────────────────────────────── */
function scenario(label,data){
  show('scenOut','⏳  '+label+' …');
  fetch(CHECKOUT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
   .then(resp=>resp.json().then(j=>show('scenOut',`${label} ⇒ ${resp.status}\n`+JSON.stringify(j,null,2),resp.ok)))
   .catch(e=>show('scenOut',e,false));
}
const dataValid  ={user:{name:"Alice",contact:"a@x"},creditCard:{number:"1111222233334444",expirationDate:"12/25",cvv:"123"},items:[{name:"Book",quantity:1,price:50}],total:50};
const dataFraud  ={user:{name:"Bob",contact:"b@x"},creditCard:{number:"4000000000000002",expirationDate:"09/26",cvv:"999"},items:[{name:"Expensive",quantity:1,price:1200}],total:1200};
const dataBadCC  ={user:{name:"C",contact:"c@x"},creditCard:{number:"1234567890",expirationDate:"01/28",cvv:"987"},items:[{name:"Book",quantity:1,price:20}],total:20};
const dataNoItems={user:{name:"D",contact:"d@x"},creditCard:{number:"9999999999999999",expirationDate:"12/30",cvv:"321"},items:[],total:0};
const dataNoUser ={creditCard:{number:"8888888888888888",expirationDate:"10/25",cvv:"111"},items:[{name:"Book",quantity:2,price:15}],total:30};

/* ─── 3.  demo endpoint  ─────────────────────────────────── */
function runDemo(){
  show('demoOut','⏳ running …');
  fetch(DEMO_URL)
    .then(resp=>resp.json().then(j=>show('demoOut',JSON.stringify(j,null,2),resp.ok)))
    .catch(e=>show('demoOut',e,false));
}

/* ─── 4.  Books‑DB helpers  ──────────────────────────────── */
async function dbGet(){
  const title=document.getElementById('titleInp').value;
  show('dbOut','⏳');
  try{
    const json = await fetch(DB_READ+'?title='+encodeURIComponent(title)).then(r=>r.json());
    show('dbOut',`${title}  stock = ${json.stock}`,true);
  }catch(e){show('dbOut',e,false);}
}
async function dbDelta(delta){
  const title=document.getElementById('titleInp').value;
  show('dbOut','⏳');
  try{
    const resp=await fetch(DB_WRITE,{method:'POST',headers:{'Content-Type':'application/json'},
                                     body:JSON.stringify({title,delta})});
    const json=await resp.json();
    const ok  = resp.ok && json.success;
    show('dbOut',`→  ${json.title}\nnew_stock = ${json.new_stock}`,ok);
  }catch(e){show('dbOut',e,false);}
}

/* ─── 5.  payment helpers  ───────────────────────────────── */
async function pay(kind){
  const order=document.getElementById('payOrder').value.trim();
  const amt  =parseFloat(document.getElementById('payAmt').value);
  const url  = (kind==='charge') ? PAY_CHARGE : PAY_REFUND;
  const body = (kind==='charge') ? {order,amount:amt} : {order};
  show('payOut','⏳');
  try{
    const resp = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const json = await resp.json();
    show('payOut',JSON.stringify(json,null,2),resp.ok);
  }catch(e){show('payOut',e,false);}
}
</script>
</body>
</html>
